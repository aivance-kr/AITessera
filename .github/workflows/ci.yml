name: CI

on:
  pull_request:
    branches: [main]     # dev → main 배포 PR 에서만 돈다. feature → dev PR 은 로컬 검증(git hooks)이 게이트.

# 같은 ref 에 새 푸시가 오면 진행 중 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.5 · CS · PHPStan · PHPUnit · Coverage)
    timeout-minutes: 30
    # self-hosted Linux(X64) 조직 러너(호스팅 러너 결제 문제로 전환, 이후 org 러너 1개로 통일).
    # MySQL·Redis 는 docker run 으로 직접 띄운다. 러너가 도커 컨테이너라 services: 가 호스트에
    # 게시한 포트(127.0.0.1)에는 닿지 못한다("Connection refused"). 실행별 전용 네트워크에
    # 러너와 컨테이너를 같이 붙이고 컨테이너 이름으로 접속한다.
    runs-on: [self-hosted, Linux, X64, docker]

    permissions:
      contents: read
      pull-requests: write

    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
      CI_MYSQL_HOST: aitessera-ci-mysql-${{ github.run_id }}
      CI_REDIS_HOST: aitessera-ci-redis-${{ github.run_id }}
      CI_NETWORK: aitessera-ci-net-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL · Redis 컨테이너 기동
        run: |
          docker rm -f -v "$CI_MYSQL_HOST" "$CI_REDIS_HOST" >/dev/null 2>&1 || true
          docker network create "$CI_NETWORK"
          docker network connect "$CI_NETWORK" "$(hostname)"
          docker run -d --name "$CI_MYSQL_HOST" --network "$CI_NETWORK" \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=aitessera \
            -e MYSQL_USER=aitessera -e MYSQL_PASSWORD=aitessera \
            --tmpfs /var/lib/mysql \
            mysql:8.0 \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-flush-method=nosync \
            --sync-binlog=0 \
            --innodb-redo-log-capacity=536870912
          docker run -d --name "$CI_REDIS_HOST" --network "$CI_NETWORK" redis:7
          # 초기화 중 임시 서버 단계의 ping 성공을 넘기려고 실제 인증 쿼리로 대기한다.
          ready=0
          for i in $(seq 1 60); do
            docker exec "$CI_MYSQL_HOST" mysql -uroot -proot -h 127.0.0.1 -e "SELECT 1" aitessera >/dev/null 2>&1 \
              && docker exec "$CI_REDIS_HOST" redis-cli ping >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL/Redis 가 60초 안에 준비되지 않았습니다"
            docker logs "$CI_MYSQL_HOST" 2>&1 | tail -20
            exit 1
          fi

      # setup-php는 Ubuntu 26.04의 ondrej/php PPA에 의존해 실패·무한 대기할 수
      # 있다. runner의 네이티브 apt 패키지를 필요한 경우에만 설치하고, 이미 준비된
      # 영속 runner에서는 설치를 건너뛴다. Redis 클라이언트는 predis/predis다.
      - name: PHP 8.4+ 보장 (러너 이미지 편차 대응)
        run: |
          APT="sudo apt-get -o DPkg::Lock::Timeout=300"
          php_ok() { command -v php >/dev/null && php -r 'exit(version_compare(PHP_VERSION, "8.4", ">=") ? 0 : 1);'; }
          # 조직 러너 이미지가 제각각이다 — ondrej PPA 가 붙은 러너는 php-cli 가 8.5 지만,
          # 네이티브 Ubuntu 24.04 러너(runner-03)는 8.3.6 이라 composer.json 요구를 못 채워
          # composer install 이 실패했다. 8.4 미만이면 PPA 로 8.5 를 설치해 기본 php 로 지정한다.
          # (Ubuntu 26.04 러너는 네이티브가 8.5 라 이 분기를 타지 않는다.)
          if ! php_ok; then
            $APT update -qq
            command -v php >/dev/null || $APT install -y --no-install-recommends php-cli
            if ! php_ok; then
              $APT install -y --no-install-recommends software-properties-common
              sudo add-apt-repository -y ppa:ondrej/php
              $APT update -qq
              $APT install -y --no-install-recommends php8.5-cli
              sudo update-alternatives --set php /usr/bin/php8.5
            fi
          fi
          # 확장은 지금 PATH 의 php 버전에 맞춰 버전 명시 패키지로, 없는 것만 설치한다
          # (버전 없는 php-intl 등은 다른 버전을 끌어와 쓰는 php 에 안 붙을 수 있다).
          V="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          MISSING=""
          for item in mbstring:mbstring intl:intl mysql:mysqli xml:dom curl:curl zip:zip sqlite3:sqlite3; do
            php -m | grep -qix "${item#*:}" || MISSING="$MISSING php${V}-${item%%:*}"
          done
          # 커버리지 드라이버(pcov/xdebug)가 없으면 phpunit 이 경고 → failOnWarning 으로 실패한다.
          php -m | grep -qiE '^(pcov|xdebug)$' || MISSING="$MISSING php${V}-xdebug"
          if [ -n "$MISSING" ]; then
            echo "설치 필요:$MISSING"
            $APT update -qq
            $APT install -y --no-install-recommends $MISSING
          fi
          command -v composer >/dev/null || $APT install -y --no-install-recommends composer
          php -v
          composer --version

      - name: PHP · 확장 확인 (없을 때만 apt 설치)
        run: |
          set -euo pipefail
          PKGS="php-cli php-intl php-mbstring php-mysql php-xml php-curl php-zip php-xdebug"
          MISSING=""
          for p in $PKGS; do
            if ! dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q '^install ok installed$'; then
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "설치 필요:$MISSING"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $MISSING
          else
            echo "필요 패키지 모두 설치됨 — apt 건너뜀"
          fi
          php -v
          composer --version
          php -r 'exit(version_compare(PHP_VERSION, "8.4", ">=") ? 0 : 1);' \
            || { echo "::error::PHP 8.4 이상이 필요하다 (현재 $(php -r 'echo PHP_VERSION;'))"; exit 1; }
          php -m | grep -qi '^xdebug$' \
            || { echo "::error::xdebug 확장이 로드되지 않았다 — 커버리지를 낼 수 없다"; exit 1; }

      - name: Composer 캐시 디렉토리 확인
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env 준비 (CI용 DB·Redis·JWT 주입)
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^APP_ENV=.*|APP_ENV=testing|' \
            -e "s|^DB_HOST=.*|DB_HOST=${CI_MYSQL_HOST}|" \
            -e 's|^DB_PORT=.*|DB_PORT=3306|' \
            -e 's|^DB_NAME=.*|DB_NAME=aitessera|' \
            -e 's|^DB_USER=.*|DB_USER=aitessera|' \
            -e 's|^DB_PASS=.*|DB_PASS=aitessera|' \
            -e "s|^REDIS_HOST=.*|REDIS_HOST=${CI_REDIS_HOST}|" \
            -e 's|^REDIS_PORT=.*|REDIS_PORT=6379|' \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci_test_secret_at_least_32_characters_long|' \
            .env

      - name: 런타임 디렉토리 생성 (git 미추적, 경로 보장)
        run: mkdir -p var/cache var/logs/raw var/logs/queue-failed

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs-check

      - name: PHPStan (level 8)
        run: composer analyse

      - name: 마이그레이션 (테스트 스키마 구성)
        run: php bin/console migrate

      - name: PHPUnit (단위·DB 통합·커버리지)
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p build
          vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-cobertura=build/cobertura.xml

      - name: 커버리지 요약
        if: always()
        run: |
          [ -f build/coverage.txt ] || exit 0
          {
            echo '### 📊 커버리지'
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary (markdown)
        if: github.event_name == 'pull_request'
        # irongut/CodeCoverageSummary 는 Docker 컨테이너 액션이다. 러너가 도커 컨테이너라
        # 액션 컨테이너에 마운트되는 /github/workspace 에 이 러너의 작업 디렉터리가 보이지
        # 않아 "No files found matching glob pattern" 으로 죽는다. 이미 생성된
        # build/coverage.txt 로 PR 코멘트용 마크다운을 직접 만든다.
        run: |
          {
            echo '### 📊 커버리지'
            echo '```'
            cat build/coverage.txt
            echo '```'
          } > code-coverage-results.md

      - name: Post coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      - name: 컨테이너 정리
        if: always()
        run: |
          docker rm -f -v "$CI_MYSQL_HOST" "$CI_REDIS_HOST" >/dev/null 2>&1 || true
          docker network disconnect -f "$CI_NETWORK" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true
