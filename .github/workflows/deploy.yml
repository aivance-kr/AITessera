name: Deploy

# main push(= dev → main 배포 PR 머지) 시 프로덕션 서버로 SSH 자동 배포.
# 수동 실행(workflow_dispatch)으로 롤백·재배포도 가능하다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 동시에 하나만. 진행 중 배포는 취소하지 않는다(중간 중단 방지).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (SSH)
    runs-on: [self-hosted, Linux, X64, docker]
    environment: production
    timeout-minutes: 60

    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # 서버에 올릴 Rust 바이너리 경로(DEPLOY_PATH 기준). rust/.gitignore 의 /target 아래라
      # git reset --hard 로 지워지지 않는다. 업로드는 .new 로 받고 SSH 단계에서 교체한다.
      RUST_BIN_REL: rust/target/release/aitessera

    steps:
      # ── Rust 포팅 빌드 ─────────────────────────────────────────────────
      # 운영서버에는 Rust 툴체인(cargo)을 두지 않는다. 러너에서 release 빌드한 뒤
      # 바이너리만 서버로 올린다. rust/ 가 없는 커밋이면 아래 Rust 단계는 모두 건너뛴다.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 러너 이미지마다 C 툴체인 유무가 달라 ring 등 네이티브 크레이트 빌드가 실패할 수 있다 — 없을 때만 설치
      - name: C 컴파일러 확인 (없을 때만 apt 설치)
        if: hashFiles('rust/Cargo.lock') != ''
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc 있음 — apt 건너뜀"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential
          fi

      # composite 액션이라 컨테이너 러너에서도 동작한다 (Docker 컨테이너 액션 아님)
      - name: Rust 툴체인 (stable)
        if: hashFiles('rust/Cargo.lock') != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cargo 캐시
        if: hashFiles('rust/Cargo.lock') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Rust release 빌드
        if: hashFiles('rust/Cargo.lock') != ''
        working-directory: rust
        run: |
          cargo build --release --locked
          ls -l target/release/aitessera
          # 서버 glibc 보다 높은 버전을 요구하면 서버에서 실행되지 않는다 — SSH 단계에서 ldd 로 다시 확인한다
          echo "러너 glibc: $(ldd --version | head -n1)"

      # appleboy/scp-action 은 Docker 컨테이너 액션이라 컨테이너 러너에서 작업 디렉터리가 안 보인다 — 셸 scp 로 올린다
      - name: Rust 바이너리 업로드 (.new)
        if: hashFiles('rust/Cargo.lock') != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          known="$RUNNER_TEMP/deploy_known_hosts"
          ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$key" )
          ssh_opts=(-i "$key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known")
          target_dir="$DEPLOY_PATH/$(dirname "$RUST_BIN_REL")"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$target_dir'"
          scp -P "${DEPLOY_PORT:-22}" -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" \
            "$RUST_BIN_REL" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/$RUST_BIN_REL.new"
          echo "업로드 완료: $DEPLOY_PATH/$RUST_BIN_REL.new"

      - name: SSH 키 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"

      - name: 프로덕션 서버 SSH 배포
        id: deploy_ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # 첫 실패 명령에서 스크립트 중단(set -e 와 동일 효과)
          script_stop: true
          command_timeout: 20m
          envs: RUST_BIN_REL
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "▶ 1) 최신 main 반영"
            git fetch --prune origin
            git reset --hard origin/main

            # var/ 는 git 미추적이라 배포마다 없을 수 있다. composer/migrate 이전에
            # 반드시 만들어 런타임 로그·캐시 경로를 보장한다.
            echo "▶ 2) 런타임 디렉토리 생성 (composer/migrate 이전)"
            mkdir -p var/cache var/logs/raw var/logs/queue-failed
            # OpenAPI 스펙 파일 캐시(var/cache/openapi.json)는 git 미추적이라 reset 으로 안 지워진다.
            # 배포마다 무효화해 신규·변경된 엔드포인트가 문서에 반영되게 한다(없으면 첫 요청에 재생성).
            rm -f var/cache/openapi.json 2>/dev/null || echo "  (openapi 캐시 삭제 건너뜀 — 소유권 상이. setgid 구성 권장)"
            # 아파치(www-data)가 만든 파일은 배포 계정 소유가 아니라 chmod 가 실패할 수 있다.
            # best-effort 로 처리하고, 근본 해결은 서버의 setgid(2775) 구성으로 한다.
            chmod -R g+rwX var 2>/dev/null || echo "  (var chmod 건너뜀 — 소유권 상이. setgid 구성 권장)"

            echo "▶ 3) 운영 의존성 설치"
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress

            # 마이그레이션 함정: DB 연결 실패·예외가 나도 CLI 종료코드가 0 일 수 있다.
            # set -e 로 못 잡으므로 출력을 캡처해 예외 패턴을 직접 검사하고 실패 시 중단한다.
            echo "▶ 4) 마이그레이션"
            MIGRATE_OUTPUT="$(php bin/console migrate 2>&1)"
            echo "$MIGRATE_OUTPUT"
            if echo "$MIGRATE_OUTPUT" | grep -qiE '\[[A-Za-z0-9_\\]*Exception[^]]*\]|Unable to connect|Access denied|SQLSTATE'; then
              echo "ERROR: 마이그레이션 실패 감지 — 배포 중단"
              exit 1
            fi

            # OPcache 갱신은 아래 PHP-FPM reload 로 처리한다(무중단). Redis 애플리케이션 캐시는
            # 큐·레이트리밋 상태를 공유하므로 배포 시 일괄 flush 하지 않는다(TTL 로 자연 갱신).
            echo "▶ 5) 아파치·PHP-FPM reload (OPcache 갱신, 무중단)"
            sudo -n systemctl reload apache2

            # PHP 는 PHP-FPM 이 실행하므로 apache2 리로드로는 OPcache 가 비워지지 않는다.
            # 실행 중인 php*-fpm 서비스를 찾아 graceful 리로드한다(처리 중 요청은 마친다).
            # sudoers 에 NOPASSWD 가 없어도 배포는 실패시키지 않는다(OPcache 는 validate_timestamps 로 결국 갱신된다).
            #   서버 준비: '<DEPLOY_USER> ALL=(ALL) NOPASSWD: /usr/bin/systemctl reload php8.5-fpm'
            fpm_svc="$(systemctl list-units --type=service --state=running --no-legend 'php*-fpm.service' | awk '{for (i = 1; i <= NF; i++) if ($i ~ /\.service$/) { print $i; exit }}')"
            fpm_svc="${fpm_svc%.service}"
            if [ -n "$fpm_svc" ]; then
              sudo -n systemctl reload "$fpm_svc" || echo "⚠️ $fpm_svc 리로드 실패(sudoers NOPASSWD 확인) — OPcache 는 validate_timestamps 로 갱신된다"
            else
              echo "⚠️ 실행 중인 php-fpm 서비스가 없어 리로드를 건너뛴다"
            fi

            # 러너가 올린 .new 를 검증 후 원자적으로 교체한다(mv 는 같은 파일시스템에서 rename).
            # 실행 중인 프로세스는 기존 inode 를 계속 쓰므로 교체 자체로는 중단되지 않는다.
            echo "▶ 6) Rust 바이너리 교체"
            rust_bin="$RUST_BIN_REL"
            if [ -f "$rust_bin.new" ]; then
              chmod 755 "$rust_bin.new"
              # 러너 glibc 가 서버보다 높으면 'GLIBC_x.y not found' — 교체하지 않고 배포를 중단한다
              if ldd "$rust_bin.new" 2>&1 | grep -q 'not found'; then
                ldd "$rust_bin.new" 2>&1 | grep 'not found'
                echo "ERROR: Rust 바이너리가 서버 라이브러리와 맞지 않음 — 교체 중단"
                rm -f "$rust_bin.new"
                exit 1
              fi
              mv -f "$rust_bin.new" "$rust_bin"
              echo "  교체 완료: $rust_bin"
              # Rust 서버를 systemd 서비스로 운영하는 경우에만 재시작한다(없으면 건너뜀).
              #   서버 준비: '<DEPLOY_USER> ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart aitessera-rust'
              if systemctl cat aitessera-rust.service >/dev/null 2>&1; then
                sudo -n systemctl restart aitessera-rust || echo "⚠️ aitessera-rust 재시작 실패(sudoers NOPASSWD 확인)"
              else
                echo "  aitessera-rust 서비스 없음 — 재시작 건너뜀"
              fi
            else
              echo "  업로드된 Rust 바이너리 없음 — 건너뜀"
            fi

            echo "✅ 배포 완료: $(git rev-parse --short HEAD)"

      - name: Slack 알림 (성공)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          # if 조건식에서는 secrets 컨텍스트를 참조할 수 없어(Unrecognized named-value),
          # 미설정 시 스킵 여부는 스크립트 내부에서 판단한다.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — Slack 알림 스킵"
            exit 0
          fi
          REPO_NAME="${REPO##*/}"
          # workflow_dispatch(수동 실행)는 head_commit 이 없어 COMMIT_MSG 가 빈 값일 수 있다.
          MSG_LINE="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          [ -z "$MSG_LINE" ] && MSG_LINE="(커밋 메시지 없음 — 수동 실행)"
          # Slack mrkdwn 링크(<url|text>) 안에 들어갈 텍스트는 &·<·> 를 이스케이프해야 한다.
          MSG_ESCAPED="$(printf '%s' "$MSG_LINE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
          payload=$(jq -n \
            --arg repo_name "$REPO_NAME" --arg repo "$REPO" --arg branch "$BRANCH" \
            --arg actor "$ACTOR" --arg msg "$MSG_ESCAPED" --arg url "$COMMIT_URL" \
            '{text: ("[" + $repo_name + "] 배포 성공\n저장소: " + $repo + "\n브랜치: " + $branch + "\n작성자: " + $actor + "\n내용: <" + $url + "|" + $msg + ">")}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Slack 알림 (실패)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — Slack 알림 스킵"
            exit 0
          fi
          REPO_NAME="${REPO##*/}"
          MSG_LINE="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          [ -z "$MSG_LINE" ] && MSG_LINE="(커밋 메시지 없음 — 수동 실행)"
          MSG_ESCAPED="$(printf '%s' "$MSG_LINE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
          payload=$(jq -n \
            --arg repo_name "$REPO_NAME" --arg repo "$REPO" --arg branch "$BRANCH" \
            --arg actor "$ACTOR" --arg msg "$MSG_ESCAPED" --arg commit_url "$COMMIT_URL" --arg run_url "$RUN_URL" \
            '{text: ("[" + $repo_name + "] 배포 실패\n저장소: " + $repo + "\n브랜치: " + $branch + "\n작성자: " + $actor + "\n내용: <" + $commit_url + "|" + $msg + ">\n실행 로그: " + $run_url)}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
